<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Products - The Cover House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            padding: 1rem 0;
        }
        .navbar-brand {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .nav-link {
            color: white !important;
            transition: transform 0.3s;
        }
        .nav-link:hover {
            transform: translateY(-2px);
        }
        .product-card {
            transition: all 0.3s ease;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        .quantity-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: #6366f1;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        .quantity-btn:hover {
            background: #4f46e5;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/customer/home">
                <i class="fas fa-mobile-alt fa-2x me-2"></i>
                The Cover House
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/customer/mobilecover">
                            <i class="fas fa-store me-1"></i>Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/customer/cart">
                            <i class="fas fa-shopping-cart me-1"></i>Cart
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${session.failure!=null || session.success!=null}" class="row justify-content-center">
            <div class="col-md-8">
                <div th:if="${session.failure}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${session.failure}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${session.success}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${session.success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:text="${@sessionMessageRemover.removeMessage()}" class="d-none"></div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4" th:each="mobileCovers:${mobileCover}">
                <div class="card product-card h-100">
                    <img th:src="${mobileCovers.imageLink}" th:alt="${mobileCovers.name}" 
                         class="card-img-top" style="height: 300px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${mobileCovers.name}"></h5>
                        <p class="card-text text-muted" th:text="${mobileCovers.description}"></p>
                        <span class="badge bg-primary mb-2" th:text="${mobileCovers.mobilebrand}"></span>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <del class="text-muted" th:text="'₹' + ${mobileCovers.dummyprice}"></del>
                            <span class="fs-4 fw-bold text-danger" th:text="'₹' + ${mobileCovers.price}"></span>
                        </div>
                        <p class="text-success" th:text="'In Stock: ' + ${mobileCovers.stock}"></p>
                        <div class="quantity-control">
                            <a th:href="'/customer/cart-remove/'+${mobileCovers.id}">
                                <button class="quantity-btn">-</button>
                            </a>
                            <span class="fw-bold" th:text="${mobileCovers.getQuantity(items)}"></span>
                            <a th:href="'/customer/cart-add/'+${mobileCovers.id}">
                                <button class="quantity-btn">+</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-4 mb-5">
            <a href="/customer/home" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left me-2"></i>Back
            </a>
            <a href="/customer/cart" class="btn btn-primary">
                <i class="fas fa-shopping-cart me-2"></i>View Cart
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
